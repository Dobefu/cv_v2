baseURL = 'https://cv.connor.nl/'
languageCode = 'en-us'
title = 'CV - Connor van Spronssen'
theme = 'resumay'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

disableHugoGeneratorInject = true
disableKinds = []
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
newContentEditor = 'nvim'
printI18nWarnings = true
printUnusedTemplates = true

[params]
  shortName = 'CV'
  description = ''
  backgroundColor = 'oklch(.92 .004 286.32)'
  themeColor = '#0d6488'

  [params.socialLinks]
    linkedin = 'https://www.linkedin.com/in/connor-van-spronssen/'
    github = 'https://github.com/Dobefu/DLiteScript'
    bluesky = 'https://bsky.app/profile/connor.nl'
    gitlab = 'https://gitlab.com/Dobefu'
    drupal = 'https://www.drupal.org/u/Dobefu'
    rss = '/rss.xml'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[outputs]
  home = ['html', 'rss', 'webappmanifest', 'json']

[security]
  [security.exec]
    allow = ['^go$', '^git$', '^nvim$']

[languages]
  [languages.en]
    contentDir = 'content/en'
    languageName = 'English'
    weight = 10

    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Projects'
        pageRef = '/projects/'
        weight = 10

      [[languages.en.menus.main]]
        name = 'Sitemap'
        url = '/sitemap.xml'
        weight = 10

  [languages.nl]
    contentDir = 'content/nl'
    languageName = 'Dutch'
    weight = 20

    [languages.nl.menus]
      [[languages.nl.menus.main]]
        name = 'Projecten'
        pageRef = '/projects/'
        weight = 10

      [[languages.nl.menus.main]]
        name = 'Sitemap'
        url = '/sitemap.xml'
        weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  [markup.highlight]
    lineNos = true
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.extensions]
      strikethrough = false

      [markup.goldmark.extensions.extras]
        delete.enable = true
        mark.enable = true
        insert.enable = true
        subscript.enable = true
        superscript.enable = true

      [markup.goldmark.extensions.passthrough]
        enable = true

        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]']]
          inline = [['\(', '\)']]

