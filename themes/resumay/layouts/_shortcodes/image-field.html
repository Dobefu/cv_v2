<div>
  <a
    aria-hidden="true"
    class="image-field"
    href="{{- .Params.url -}}"
    rel="external"
    role="img"
    target="_blank"
  >
    <img src="{{- .Params.img -}}" />

    <div>
      <label>{{- .Params.label -}}</label>
      <p>{{- .Params.text -}}</p>
      <p>{{- .Params.subtext -}}</p>
    </div>
  </a>
</div>
