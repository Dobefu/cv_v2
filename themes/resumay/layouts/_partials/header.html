<header aria-label="{{- site.Title -}}" class="header">
  <div class="container">
    <div class="header__inner">
      <a href="{{- "/" | relLangURL -}}">
        <h1 class="header__title">
          <img
            alt="{{- i18n "header.logoAlt" -}}"
            aria-hidden="true"
            src="/logo-white.svg"
          />

          {{- site.Title -}}
        </h1>
      </a>

      {{- partial "language-switcher.html" . -}}
    </div>
  </div>
</header>
