<header aria-label="{{- site.Title -}}" class="header">
  <div class="container">
    <div class="header__inner">
      <a href="{{- "/" | relLangURL -}}">
        <span class="header__title">
          <img
            alt="{{- i18n "header.logoAlt" -}}"
            aria-hidden="true"
            height="48px"
            src="/logo-white.svg"
            width="48px"
          />

          {{- site.Title -}}
        </span>
      </a>

      {{- partial "language-switcher.html" . -}}
    </div>
  </div>
</header>
