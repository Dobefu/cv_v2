<!DOCTYPE html>
<html
  dir="{{ or site.Language.LanguageDirection `ltr` }}"
  lang="{{ site.Language.LanguageCode }}"
>
  {{ partial "head.html" . }}
  <body>
    {{- partial "skip-link.html" . -}}

    {{ partial "header.html" . }}

    {{- block "hero" . -}}{{- end -}}

    <main id="main-content">
      <div class="container">
        {{- block "main" . -}}{{- end -}}
      </div>
    </main>

    {{ partial "footer.html" . }}

    {{- partialCached "head/js.html" . -}}
  </body>
</html>
