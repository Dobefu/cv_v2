{{- define "main" -}}
  <h1>{{ .Title }}</h1>
  <p>{{ .Content }}</p>

  {{- range .Pages -}}
    <hr />

    <section>
      <a class="project" href="{{ .RelPermalink }}">
        {{- if .Params.imgSrc -}}
          <div class="project__image">
            <img
              alt="{{ .Params.imgAlt}}"
              src="{{ .Params.imgSrc }}"
              style="view-transition-name: img-{{- .File.UniqueID -}}"
            />
          </div>
        {{- end -}}

        <div class="project__details">
          <h2
            style="view-transition-name: title-{{- .File.UniqueID -}}"
          >
            {{- .LinkTitle -}}
          </h2>

          <p
            style="view-transition-name: teaser-{{- .File.UniqueID -}}"
          >
            {{- .Params.teaserText -}}
          </p>
        </div>
      </a>
    </section>
  {{- end -}}
{{- end -}}
