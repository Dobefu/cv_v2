{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <p>{{ .Content }}</p>

  {{ range .Pages }}
    <hr />

    <section>
      <a class="project" href="{{ .RelPermalink }}">
        {{- if .Params.imgSrc -}}
          <div class="project__image">
            <img
              alt="{{ .Params.imgAlt}}"
              src="{{ .Params.imgSrc }}"
            />
          </div>
        {{- end -}}

        <div class="project__details">
          <h2>{{ .LinkTitle }}</h2>
          <p>{{- .Params.teaserText -}}</p>
        </div>
      </a>
    </section>
  {{ end }}
{{ end }}
